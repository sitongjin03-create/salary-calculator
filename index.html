<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="收入仪表盘">
  <meta name="theme-color" content="#3D5A56">
  <meta name="description" content="今日收入仪表盘 - 实时记录你的时间价值">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%233D5A56' width='100' height='100' rx='20'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23C8963E' stroke-width='4'/><text x='50' y='62' text-anchor='middle' font-size='40' fill='%23fff'>¥</text></svg>">
  <title>今日收入仪表盘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="app-title">今日收入仪表盘</h1>
        <p class="app-subtitle">实时记录你的时间价值</p>
      </div>
      <button class="settings-toggle" id="settingsToggle" aria-label="设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Settings Overlay (Bottom Sheet) -->
    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-sheet" id="settingsSheet">
        <div class="settings-sheet-header">
          <h2 class="settings-sheet-title">收益参数设置</h2>
        </div>
        <div class="settings-sheet-body">
          <!-- 薪资模式 -->
          <div class="setting-row">
            <label class="setting-label">薪资模式</label>
            <div class="segmented-control" id="salaryModeToggle">
              <button class="seg-btn active" data-mode="daily">日薪</button>
              <button class="seg-btn" data-mode="monthly">月薪</button>
            </div>
          </div>
          <!-- 日薪 -->
          <div class="setting-row salary-row" id="dailySalaryRow">
            <label class="setting-label" for="dailySalary">日薪</label>
            <div class="setting-control">
              <span class="unit-text">¥</span>
              <input type="text" inputmode="numeric" pattern="[0-9]*\.?[0-9]*" class="setting-input" id="dailySalary" value="500" placeholder="500">
            </div>
          </div>
          <!-- 月薪 -->
          <div class="setting-row salary-row hidden" id="monthlySalaryRow">
            <label class="setting-label" for="monthlySalary">月薪</label>
            <div class="setting-control">
              <span class="unit-text">¥</span>
              <input type="text" inputmode="numeric" pattern="[0-9]*\.?[0-9]*" class="setting-input" id="monthlySalary" value="11000" placeholder="11000">
            </div>
          </div>
          <!-- 上班时间 -->
          <div class="setting-row">
            <label class="setting-label" for="startTime">上班时间</label>
            <input type="time" class="setting-input" id="startTime" value="09:00">
          </div>
          <!-- 下班时间 -->
          <div class="setting-row">
            <label class="setting-label" for="endTime">下班时间</label>
            <input type="time" class="setting-input" id="endTime" value="18:00">
          </div>
          <!-- 午休时长 -->
          <div class="setting-row">
            <label class="setting-label" for="breakTime">午休时长</label>
            <div class="setting-control">
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="setting-input" id="breakTime" value="60" placeholder="60">
              <span class="unit-text">分钟</span>
            </div>
          </div>
          <!-- 分隔 -->
          <div class="settings-divider"><span>月薪计算设置</span></div>
          <!-- 工作日模式 -->
          <div class="setting-row">
            <label class="setting-label">工作日模式</label>
            <div class="segmented-control" id="workModeToggle">
              <button class="seg-btn active" data-mode="double">双休</button>
              <button class="seg-btn" data-mode="single">单休</button>
              <button class="seg-btn" data-mode="custom">自定义</button>
            </div>
          </div>
          <!-- 自定义休息日 -->
          <div class="setting-row hidden" id="customRestRow">
            <label class="setting-label">每周休息日</label>
            <div class="weekday-picker" id="restDayPicker">
              <button class="wd-btn active" data-day="6">六</button>
              <button class="wd-btn active" data-day="7">日</button>
              <button class="wd-btn" data-day="1">一</button>
              <button class="wd-btn" data-day="2">二</button>
              <button class="wd-btn" data-day="3">三</button>
              <button class="wd-btn" data-day="4">四</button>
              <button class="wd-btn" data-day="5">五</button>
            </div>
          </div>
          <!-- 法定节假日 -->
          <div class="setting-row">
            <label class="setting-label">法定节假日休息</label>
            <div class="segmented-control" id="holidayToggle">
              <button class="seg-btn active" data-mode="yes">是</button>
              <button class="seg-btn" data-mode="no">否</button>
            </div>
          </div>
          <!-- 休假日期 -->
          <div class="setting-row">
            <label class="setting-label" for="vacationDays">休假日期</label>
            <input type="text" class="setting-input date-list-input" id="vacationDays" placeholder="2025-06-20, 2025-06-21">
          </div>
          <!-- 补班日期 -->
          <div class="setting-row">
            <label class="setting-label" for="makeupDays">补班日期</label>
            <input type="text" class="setting-input date-list-input" id="makeupDays" placeholder="2025-06-28">
          </div>
          <!-- 计算月份 -->
          <div class="setting-row">
            <label class="setting-label" for="calcMonth">计算月份</label>
            <input type="month" class="setting-input" id="calcMonth" value="2025-06">
          </div>
          <!-- 月计算结果 -->
          <div class="monthly-summary" id="monthlySummary">
            <div class="ms-row"><span>月工作天数</span><span class="ms-val" id="monthlyWorkdays">--</span></div>
            <div class="ms-row"><span>预计月收入</span><span class="ms-val highlight" id="monthlyIncome">--</span></div>
          </div>
        </div>
        <div class="settings-sheet-footer">
          <button class="btn-cancel" id="cancelSettings">取消</button>
          <button class="btn-save" id="saveSettings">保存设置</button>
        </div>
      </div>
    </div>

    <!-- Main Display Card -->
    <div class="main-card" id="mainCard">
      <!-- Hero: 今日已收入 -->
      <div class="hero-section">
        <div class="hero-label">今日已收入</div>
        <div class="hero-value" id="earnedMoney">¥0.00</div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="progress-label" id="progressLabel">0%</div>
      </div>

      <!-- Status -->
      <div class="status-section" id="statusSection">
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="status-text" id="statusText">加载中...</div>
      </div>

      <!-- Stats Grid: 2x2 -->
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="workedTime">0h 0m</div>
          <div class="stat-label">已工作</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="remainingTime">--</div>
          <div class="stat-label" id="remainingLabel">剩余时间</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="hourlyRate">--</div>
          <div class="stat-label">时薪</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="secondlyRate">--</div>
          <div class="stat-label">秒薪</div>
        </div>
      </div>

      <!-- Time (small, secondary) -->
      <div class="meta-section">
        <span class="meta-time" id="currentTime">00:00:00</span>
        <span class="meta-sep">·</span>
        <span class="meta-date" id="currentDate">2024年1月1日 星期一</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>每一分钟，都在形成你的今日价值</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
