<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="工资计算器">
  <meta name="theme-color" content="#FFB5C2">
  <meta name="description" content="今日工资实时计算器 - 每秒刷新，看看今天赚了多少钱">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23FFB5C2' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='55'>💰</text></svg>">
  <title>💰 今日工资计算器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="app-title">💰 今日工资计算器</h1>
      <p class="app-subtitle">打工人的实时小账本</p>
      <button class="settings-toggle" id="settingsToggle" aria-label="设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-card">
        <div class="setting-row">
          <label class="setting-label" for="startTime">
            <span class="setting-icon">🌅</span> 上班时间
          </label>
          <input type="time" class="setting-input" id="startTime" value="09:00">
        </div>
        <div class="setting-row">
          <label class="setting-label" for="endTime">
            <span class="setting-icon">🌇</span> 下班时间
          </label>
          <input type="time" class="setting-input" id="endTime" value="18:00">
        </div>
        <div class="setting-row">
          <label class="setting-label" for="dailySalary">
            <span class="setting-icon">💵</span> 今日日薪
          </label>
          <div class="salary-input-wrap">
            <span class="salary-prefix">¥</span>
            <input type="number" class="setting-input salary-input" id="dailySalary" value="500" min="0" step="1" placeholder="500">
          </div>
        </div>
        <div class="setting-row">
          <label class="setting-label" for="breakTime">
            <span class="setting-icon">☕</span> 午休/不计薪时长
          </label>
          <div class="break-input-wrap">
            <input type="number" class="setting-input break-input" id="breakTime" value="60" min="0" max="480" step="5" placeholder="60">
            <span class="break-suffix">分钟</span>
          </div>
        </div>
        <button class="save-btn" id="saveSettings">💾 保存设置</button>
      </div>
    </div>

    <!-- Main Display Card -->
    <div class="main-card" id="mainCard">
      <!-- Current Time -->
      <div class="time-section">
        <div class="current-time" id="currentTime">00:00:00</div>
        <div class="current-date" id="currentDate">2024年1月1日 星期一</div>
      </div>

      <!-- Status -->
      <div class="status-section" id="statusSection">
        <div class="status-emoji" id="statusEmoji">⏰</div>
        <div class="status-text" id="statusText">加载中...</div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="progress-label" id="progressLabel">0%</div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-icon">⏱️</div>
          <div class="stat-value" id="workedTime">0小时0分</div>
          <div class="stat-label">今日已工作</div>
        </div>
        <div class="stat-item highlight">
          <div class="stat-icon">💰</div>
          <div class="stat-value money" id="earnedMoney">¥0.00</div>
          <div class="stat-label">今日已赚</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">🏁</div>
          <div class="stat-value" id="remainingTime">--</div>
          <div class="stat-label" id="remainingLabel">距离下班</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>💪 加油打工人，每一天都值得</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
